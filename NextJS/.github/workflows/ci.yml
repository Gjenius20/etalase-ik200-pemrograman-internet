name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Audit dependency (triage-aware)
        run: npm run audit:check

  e2e:
    # Aktifkan lewat repository variable RUN_E2E=true dan isi secrets Neon/DB.
    # Deploy & konfigurasi produksi tetap dilakukan oleh pemilik project.
    if: ${{ vars.RUN_E2E == 'true' }}
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright@1.65.1 install chromium
      - name: Verifikasi akhir
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          NEON_STORAGE_BUCKET: ${{ secrets.NEON_STORAGE_BUCKET }}
        run: |
          npm run build
          npm run start &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          npm run verify:rate-limit
          npm run verify:neon
          npm run verify:media
          npm run verify:ui
          npm run verify:a11y
